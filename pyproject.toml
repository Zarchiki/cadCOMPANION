[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadcompanion"
version = "1.0.0"
description = "High-performance, popup-free AutoCAD Model Context Protocol (MCP) Server for AI Drafting"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Zarchiki" }
]
keywords = [
    "autocad",
    "mcp",
    "model-context-protocol",
    "cad",
    "antigravity",
    "claude",
    "gemini",
    "drafting",
    "architecture"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Computer Aided Design (CAD)",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]<2",
    "pywin32>=306",
    "Pillow>=10.0.0",
]

[project.scripts]
cadcompanion = "autocad_mcp_server:main"
